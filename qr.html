<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Popup</title>
    <style>
        /* QR Modal Styles */
        .qr-modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);

  /* ADD THIS */
  justify-content: center;
  align-items: center;
}

        .qr-modal-content {
            position: relative;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            margin: 5% auto;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .qr-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            transition: all 0.2s ease;
            line-height: 1;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .qr-close:hover {
            color: #333;
            background: #f0f0f0;
            transform: scale(1.1);
        }

        .qr-code-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        .qr-code-img {
            width: 250px;
            height: 250px;
            border: 3px solid #4CAF50;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
            object-fit: contain;
            background: white;
        }

        .qr-code-img:hover {
            transform: scale(1.05);
        }

        .qr-placeholder {
            width: 250px;
            height: 250px;
            border: 3px dashed #ccc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            background: #f9f9f9;
            font-family: Arial, sans-serif;
        }

        .qr-title {
            font-size: 26px;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .qr-subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .qr-instructions {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
            text-align: left;
            border-left: 4px solid #4CAF50;
            font-family: Arial, sans-serif;
        }

        .qr-instructions strong {
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        .qr-url {
            font-size: 13px;
            color: #777;
            margin-top: 15px;
            font-family: Arial, sans-serif;
        }

        .qr-url a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }

        .qr-url a:hover {
            text-decoration: underline;
        }

        /* Demo button styles */
        .demo-section {
            padding: 50px 20px;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .demo-button {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .demo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .demo-button:active {
            transform: translateY(0);
        }

        .demo-title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }

        .demo-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .qr-modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            .qr-code-img, .qr-placeholder {
                width: 200px;
                height: 200px;
            }
            
            .qr-title {
                font-size: 22px;
            }
            
            .qr-subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Section -->
    <div class="demo-section">
        <h1 class="demo-title">QR Code Popup Demo</h1>
        <p class="demo-subtitle">Click the button below to see the QR code popup in action</p>
        <button class="demo-button" onclick="openModal()">
        <p style="margin-top: 30px; color: #999; font-size: 14px;">
            To use this in your project, just copy the CSS and JavaScript parts!
        </p>
    </div>

    <!-- QR Code Modal -->
<div id="cvModal" class="qr-modal">
  <div class="qr-modal-content">
    <span class="qr-close" onclick="closeModal()">&times;</span>

    <h2>📄 Download My CV</h2>
    <p>Click below to download my latest CV</p>

    <button class="demo-button" onclick="downloadCV()">⬇️ Download CV</button>
  </div>
</div>

    <script>
 function openModal() {
  document.getElementById('cvModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('cvModal').style.display = 'none';
  document.body.style.overflow = 'auto';
}

function downloadCV() {
  const link = document.createElement('a');
  link.href = 'image/Puneesha.pdf'; // 🔥 put correct path
  link.download = 'Puneesha_CV.pdf';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
  window.onclick = function(event) {
  const modal = document.getElementById('cvModal');
  if (event.target === modal) {
    closeModal();
  }
};

  // Close modal with Escape key
  document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
          closeQRModal();
      }
  });

  // Prevent modal content clicks from closing the modal
  document.addEventListener('DOMContentLoaded', function() {
      const modalContent = document.querySelector('.qr-modal-content');
      if (modalContent) {
          modalContent.addEventListener('click', function(event) {
              event.stopPropagation();
          });
      }

      // 👇 Add event listener for navbar link
      const qrButton = document.getElementById('qrButton');
      if (qrButton) {
          qrButton.addEventListener('click', function(event) {
              event.preventDefault(); // stop page from jumping to top
              openQRModal();
          });
      }
  });
</script>


<script>
  function myMenuFunction() {
    const navMenu = document.getElementById("myNavMenu");
    const hamburger = document.getElementById("hamburger");
    if (navMenu) navMenu.classList.toggle("active");
    if (hamburger) hamburger.classList.toggle("active");
  }
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav_menu_list .nav-link').forEach(link => {
      link.addEventListener('click', () => {
        const nm = document.getElementById("myNavMenu");
        const hb = document.getElementById("hamburger");
        if (nm) nm.classList.remove("active");
        if (hb) hb.classList.remove("active");
      });
    });
  });
</script>
</body>
</html>
